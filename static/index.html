<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burp Suite Chat Practice Lab</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .chat-container { width: 100%; max-width: 650px; background: #1e293b; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; height: 85vh; border: 1px solid #334155; }
    .chat-header { padding: 16px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; background: #1e293b; border-radius: 12px 12px 0 0; }
    .chat-header h2 { font-size: 1.15rem; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .status-badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 9999px; background: #ef4444; color: white; font-weight: bold; }
    .status-badge.connected { background: #22c55e; }
    .mode-bar { padding: 10px 20px; background: #0f172a; font-size: 0.82rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
    .mode-selector { display: flex; gap: 12px; }
    .mode-selector label { cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .chat-messages { flex: 1; padding: 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg-box { padding: 10px 14px; border-radius: 8px; max-width: 80%; word-break: break-word; line-height: 1.4; }
    .msg-system { align-self: center; background: #334155; font-size: 0.75rem; color: #94a3b8; border-radius: 12px; padding: 4px 12px; }
    .msg-user { align-self: flex-start; background: #2d3748; border-left: 3px solid #38bdf8; }
    .msg-mine { align-self: flex-end; background: #1e3a8a; border-right: 3px solid #60a5fa; }
    .msg-meta { font-size: 0.7rem; color: #94a3b8; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 12px; }
    .msg-content { font-size: 0.95rem; }
    .chat-input-area { padding: 16px 20px; border-top: 1px solid #334155; display: flex; flex-direction: column; gap: 10px; background: #1e293b; border-radius: 0 0 12px 12px; }
    .login-row, .input-row { display: flex; gap: 10px; }
    input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 0.95rem; outline: none; }
    input[type="text"]:focus { border-color: #38bdf8; }
    button { padding: 10px 18px; border: none; border-radius: 6px; background: #0284c7; color: white; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .burp-tip { font-size: 0.75rem; color: #fbbf24; background: rgba(251, 191, 36, 0.1); padding: 6px 12px; border-radius: 4px; border: 1px dashed rgba(251, 191, 36, 0.4); }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h2>🎯 Burp Suite Chat Lab</h2>
    <span id="status" class="status-badge">Offline</span>
  </div>

  <div class="mode-bar">
    <div>Send Mode:</div>
    <div class="mode-selector">
      <label>
        <input type="radio" name="protocol" value="ws" checked>
        WebSocket (Burp WS Tab)
      </label>
      <label>
        <input type="radio" name="protocol" value="http">
        HTTP POST (Burp HTTP History)
      </label>
    </div>
  </div>

  <div id="messages" class="chat-messages">
    <div class="msg-box msg-system">Open this page in Burp Suite's Embedded Browser to intercept traffic!</div>
  </div>

  <div class="chat-input-area">
    <div class="burp-tip" id="burpTip">
      💡 Tip: With <b>HTTP POST</b> selected, turn on <i>Proxy &gt; Intercept is on</i> in Burp to inspect & modify messages before they hit the server.
    </div>

    <!-- Login / Username Section -->
    <div class="login-row" id="loginSection">
      <input type="text" id="usernameInput" placeholder="Enter username (e.g. Alice, Bob)..." value="User1">
      <button id="connectBtn" onclick="connectChat()">Join Chat</button>
    </div>

    <!-- Chat Message Section -->
    <div class="input-row" id="chatSection" style="display: none;">
      <input type="text" id="msgInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script>
  let ws = null;
  let currentUser = "";
  const messagesDiv = document.getElementById("messages");
  const statusBadge = document.getElementById("status");

  function appendMessage(msg) {
    const div = document.createElement("div");
    if (msg.type === "system") {
      div.className = "msg-box msg-system";
      div.textContent = `[${msg.timestamp}] ${msg.content}`;
    } else {
      const isMine = msg.sender === currentUser;
      div.className = `msg-box ${isMine ? 'msg-mine' : 'msg-user'}`;
      div.innerHTML = `
        <div class="msg-meta">
          <strong>${escapeHtml(msg.sender)}</strong>
          <span>${msg.timestamp}</span>
        </div>
        <div class="msg-content">${escapeHtml(msg.content)}</div>
      `;
    }
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function escapeHtml(text) {
    if (!text) return "";
    return text.replace(/[&<>"']/g, function(m) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'}[m];
    });
  }

  function connectChat() {
    const input = document.getElementById("usernameInput");
    currentUser = input.value.trim();
    if (!currentUser) return alert("Please enter a username");

    const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    const wsUrl = `${protocol}//${window.location.host}/ws/${encodeURIComponent(currentUser)}`;

    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      statusBadge.textContent = `Online: ${currentUser}`;
      statusBadge.classList.add("connected");
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("chatSection").style.display = "flex";
      document.getElementById("msgInput").focus();
    };

    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        appendMessage(msg);
      } catch (e) {
        console.error("Failed to parse message:", event.data);
      }
    };

    ws.onclose = () => {
      statusBadge.textContent = "Offline";
      statusBadge.classList.remove("connected");
      document.getElementById("loginSection").style.display = "flex";
      document.getElementById("chatSection").style.display = "none";
    };

    ws.onerror = (err) => {
      console.error("WebSocket error:", err);
    };
  }

  async function sendMessage() {
    const input = document.getElementById("msgInput");
    const content = input.value.trim();
    if (!content) return;

    const mode = document.querySelector('input[name="protocol"]:checked').value;

    if (mode === "ws" && ws && ws.readyState === WebSocket.OPEN) {
      // Send via WebSocket (visible in Burp's Proxy -> WebSockets history / Intercept)
      ws.send(JSON.stringify({ sender: currentUser, content: content }));
      input.value = "";
    } else {
      // Send via HTTP POST (visible in Burp's Proxy -> HTTP history / Intercept / Repeater)
      try {
        const response = await fetch("/api/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sender: currentUser, content: content })
        });
        if (response.ok) {
          input.value = "";
        }
      } catch (err) {
        console.error("HTTP send error:", err);
      }
    }
  }

  // Pre-load past messages
  fetch("/api/messages")
    .then(r => r.json())
    .then(data => {
      if (data.messages) {
        data.messages.forEach(appendMessage);
      }
    })
    .catch(() => {});
</script>
</body>
</html>
